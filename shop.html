<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - LocRobster Studios Wearable Art & Merchandise</title>
  <meta name="description" content="Shop wearable art and unique merchandise featuring LocRobster Studios original designs. Premium quality products through secure Printify platform.">
  <meta name="keywords" content="wearable art, art prints, merchandise, loc robster shop, custom designs, printify, digital art prints">
  <meta name="author" content="LocRobster Studios">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#4b1f9e">
  <link rel="canonical" href="https://locrobsterstudios.com/shop.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://locrobsterstudios.com/shop.html">
  <meta property="og:title" content="LocRobster Studios Shop">
  <meta property="og:description" content="Shop wearable art and merchandise featuring original LocRobster Studios designs.">
  <meta property="og:image" content="https://locrobsterstudios.com/graphics/mainbanner.png">
  <meta property="og:site_name" content="LocRobster Studios">
  <meta property="og:locale" content="en_US">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://locrobsterstudios.com/shop.html">
  <meta property="twitter:title" content="LocRobster Studios Shop">
  <meta property="twitter:description" content="Shop wearable art and merchandise featuring original LocRobster Studios designs.">
  <meta property="twitter:image" content="https://locrobsterstudios.com/graphics/mainbanner.png">
  <meta property="twitter:site" content="@locrobster">
  <!-- <link rel="icon" type="image/png" href="graphics/favicon.png" /> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css?v=20251019-01" />
  <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="subpage">
  <!-- Banner -->
<div class="banner cropped">
  <img src="graphics/mainbanner.png" alt="Main Banner">
  <img src="graphics/bannerlogo.png" alt="LocRobster Studios Logo">
</div>

  <!-- Navigation Buttons -->
  <div class="button-container">
    <a href="shop.html" class="frosted-btn active" aria-current="page">Shop Gallery</a>
    <a href="index.html" class="frosted-btn home-btn"><i data-lucide="home"></i></a>
    <a href="gallery.html" class="frosted-btn">Art Gallery</a>
  </div>

  <!-- === LAUNCH SALE & PRICING INFO === -->
  <section class="about-layered-section">
    <div class="about-layered-base">
      <div class="about-layered-accent">
        <div class="about-layered-text">
          <p style="margin: 0 0 8px 0; font-size: 28px; font-weight: 700; text-align: center;">
            <span style="background: linear-gradient(45deg, #ff6b6b, #4ecdc4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Launch Sale Happening Now</span>
          </p>
          
          <div style="text-align: center; margin: 10px 0;">
            <p style="margin: 0 0 6px 0; font-size: 32px; font-weight: 700;">
              <span style="font-size: 20px; font-weight: 500; margin-right: 8px;">All Shirts</span>
              <span style="font-size: 20px; font-weight: 500; background: linear-gradient(45deg, #ff6b6b, #4ecdc4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">$25</span>
              <span style="font-size: 18px; opacity: 0.7;">(before tax)</span>
            </p>
            <p style="margin: 0 0 6px 0; font-size: 20px; font-weight: 600;">FREE Standard Shipping</p>
            <p style="margin: 0 0 15px 0; font-size: 16px; opacity: 0.8;">Secure shopping through Printify.com.</p>
            
            <div style="margin: 15px 0;">
              <a href="https://locrobsterstudios.printify.me/" target="_blank" class="frosted-btn" style="font-size: 18px; padding: 14px 28px; font-weight: 600;">
                Shop Now
              </a>
            </div>
          </div>
          
          <style>
          @media (max-width: 768px) {
            .about-layered-section .about-layered-text p {
              margin-bottom: 2px !important;
            }
            .about-layered-section .about-layered-text div {
              margin: 4px 0 !important;
            }
            .about-layered-section .about-layered-text div div {
              margin: 6px 0 !important;
            }
            .about-layered-section .about-layered-text {
              padding: 8px !important;
            }
            .about-layered-section .about-layered-text p:first-child {
              font-size: 18px !important;
            }
            .about-layered-section .about-layered-text p span:first-child {
              font-size: 20px !important;
            }
            .about-layered-section .about-layered-text p span:nth-child(2) {
              font-size: 20px !important;
            }
            .about-layered-section .about-layered-text p span:nth-child(3) {
              font-size: 16px !important;
            }
            .about-layered-section .about-layered-text div p:nth-child(2) {
              font-size: 14px !important;
            }
            .about-layered-section .about-layered-text div p:nth-child(3) {
              font-size: 12px !important;
            }
            .about-layered-section .frosted-btn {
              font-size: 14px !important;
              padding: 8px 16px !important;
              min-height: auto !important;
              height: auto !important;
            }
            .about-layered-section .about-layered-text div p:last-child {
              font-size: 11px !important;
            }
          }
          </style>
        </div>
      </div>
    </div>
  </section>

  <!-- Shop Gallery Section -->
  <section class="index-featured-gallery gallery-wrap">
    <div class="gallery-grid-shop"></div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="socials">
      <a href="https://www.tiktok.com/@locrobster" target="_blank"><i class="fab fa-tiktok"></i></a>
      <a href="https://www.instagram.com/locrobster_studios" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://www.youtube.com/@LocRobster" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://x.com/locrobster" target="_blank"><i class="fab fa-x-twitter"></i></a>
      <a href="https://www.twitch.tv/locrobster" target="_blank"><i class="fab fa-twitch"></i></a>
    </div>
    <div class="copyright">© 2025 LocRobster Studios. All Rights Reserved.</div>
  </footer>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "LocRobster Studios Shop",
    "description": "Wearable art and merchandise featuring original designs from LocRobster Studios.",
    "url": "https://locrobsterstudios.com/shop.html",
    "image": "https://locrobsterstudios.com/graphics/mainbanner.png",
    "sameAs": [
      "https://www.instagram.com/locrobster_studios",
      "https://www.tiktok.com/@locrobster",
      "https://x.com/locrobster"
    ],
    "brand": {
      "@type": "Brand",
      "name": "LocRobster Studios"
    }
  }
  </script>

  <script>
  function toggleShopInfo() {
    const infoDiv = document.getElementById('shop-info');
    if (infoDiv.style.display === 'none' || infoDiv.style.display === '') {
      infoDiv.style.display = 'block';
    } else {
      infoDiv.style.display = 'none';
    }
  }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="script.js?v=20251013-01"></script>
  <script>lucide.createIcons();</script>

  <style>
  @media (max-width: 768px) {
    .about-layered-section .frosted-btn {
      font-size: 14px !important;
      padding: 8px 16px !important;
      min-height: auto !important;
      height: auto !important;
    }
  }
  </style>

  <script type="module">
  import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.js';
  const lightbox = new PhotoSwipeLightbox({
    gallery: '.gallery-grid-shop',
    children: 'a',
    pswpModule: () => import('https://unpkg.com/photoswipe@5/dist/photoswipe.esm.js')
  });
  lightbox.init();
</script>
</body>
</html>
